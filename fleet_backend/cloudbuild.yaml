steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fleet-command-center:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fleet-command-center:latest'
      - '.'

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fleet-command-center:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fleet-command-center:latest'

  # Step 3: Deploy image to Cloud Run service fleet-command-center
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fleet-command-center'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fleet-command-center:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/fleet-command-center:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/fleet-command-center:latest'

options:
  logging: CLOUD_LOGGING_ONLY
