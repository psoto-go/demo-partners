steps:
  # =========================================================================
  # SERVICE 1: fleet-command-center (Backend API & Logistics Dashboard)
  # =========================================================================
  # Build Docker Image for fleet-command-center
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-command-center:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-command-center:latest'
      - './fleet_backend'
    id: 'build-fleet-backend'

  # Push Docker Image for fleet-command-center
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-command-center:$COMMIT_SHA']
    id: 'push-fleet-backend'
    waitFor: ['build-fleet-backend']

  # Deploy fleet-command-center to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fleet-command-center'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-command-center:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--project'
      - '$PROJECT_ID'
      - '--quiet'
    id: 'deploy-fleet-backend'
    waitFor: ['push-fleet-backend']

  # =========================================================================
  # SERVICE 2: fleet-mcp-server (Custom FastMCP SSE/HTTP Server)
  # =========================================================================
  # Build Docker Image for fleet-mcp-server
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-mcp-server:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-mcp-server:latest'
      - './fleet_mcp_server'
    id: 'build-fleet-mcp'

  # Push Docker Image for fleet-mcp-server
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-mcp-server:$COMMIT_SHA']
    id: 'push-fleet-mcp'
    waitFor: ['build-fleet-mcp']

  # Deploy fleet-mcp-server to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fleet-mcp-server'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-mcp-server:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--project'
      - '$PROJECT_ID'
      - '--quiet'
    id: 'deploy-fleet-mcp'
    waitFor: ['push-fleet-mcp']

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-command-center:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-command-center:latest'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-mcp-server:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/fleet-repo/fleet-mcp-server:latest'

options:
  logging: CLOUD_LOGGING_ONLY
